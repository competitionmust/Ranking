<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AIESEC in MUST Ranking</title>
<meta name="theme-color" content="#060b1a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#060b1a;--tx:#eef3ff;--mu:#93a3c7;--gl:rgba(255,255,255,.055);--bd:rgba(255,255,255,.11);--pr:#2b8cff;--cy:#22d3ee;--gold:#fbbf24;--rd:#ff4d6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bl{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:#0b5fff;top:-18vmax;left:-12vmax}
.b2{width:38vmax;height:38vmax;background:#0ea5c6;bottom:-14vmax;right:-10vmax;animation-delay:-7s}
.b3{width:30vmax;height:30vmax;background:#7c3aed;top:35%;left:55%;opacity:.28;animation-delay:-13s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.18)}}
.w{max-width:880px;margin:0 auto;padding:22px 14px 40px}
.hero{text-align:center;padding:10px 0 20px;animation:up .8s both}
.logo{width:min(250px,62vw);height:auto;filter:drop-shadow(0 0 26px rgba(43,140,255,.55));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
h1{margin:6px 0 10px;font-size:clamp(24px,6.2vw,40px);font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#fff,#9cc9ff 45%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--gl);border:1px solid var(--bd);font-size:13px;font-weight:600;backdrop-filter:blur(8px)}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 1.8s infinite}
.pill.off .dot{background:var(--rd);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.riot{letter-spacing:3px;font-weight:800;background:linear-gradient(90deg,#ff4d6d,#ff9d4d);-webkit-background-clip:text;background-clip:text;color:transparent}
.eb{margin-top:16px;display:flex;flex-direction:column;align-items:center}.eb small{margin-bottom:10px;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--mu)}.rl{height:112px;width:auto;margin-top:2px;filter:drop-shadow(0 0 16px rgba(60,110,255,.85)) drop-shadow(0 0 2px rgba(170,195,255,.7));animation:float 6s ease-in-out infinite}.eb.sm{margin-top:14px}.eb.sm .rl{height:70px}
.brands{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,26px)}.brands .logo{width:min(230px,43vw)}.brands .rl{height:clamp(86px,25vw,132px);margin:0}.vr{width:1px;height:76px;flex:none;background:linear-gradient(transparent,rgba(255,255,255,.4),transparent)}.foot .rl{height:62px;display:block;margin:16px auto 0}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:4px;margin-bottom:12px;backdrop-filter:blur(10px);animation:up .8s .1s both}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:linear-gradient(135deg,var(--pr),#0a5fe0);box-shadow:0 6px 22px rgba(43,140,255,.45);transition:transform .38s cubic-bezier(.3,1.3,.5,1)}
.seg[data-t="t"] .ind{transform:translateX(100%)}
.seg button{position:relative;z-index:1;background:none;border:0;color:var(--tx);font:600 15px "Poppins",system-ui,sans-serif;padding:11px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;animation:up .8s .2s both}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:99px;border:1px solid var(--bd);background:var(--gl);color:var(--mu);font:600 13px "Poppins",system-ui,sans-serif;cursor:pointer;transition:.25s}
.chip:hover{color:var(--tx);transform:translateY(-1px)}.chip.on{background:var(--cy);border-color:var(--cy);color:#04222a}
.sr{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font:500 15px "Poppins",system-ui,sans-serif;margin-bottom:16px;outline:0;backdrop-filter:blur(8px);transition:.25s;animation:up .8s .3s both}
.sr:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(43,140,255,.25)}.sr::placeholder{color:var(--mu)}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:8px 0 18px}
.pc{flex:1;max-width:220px;text-align:center;animation:up .7s both}
.pc .md{font-size:30px;animation:float 4s ease-in-out infinite}
.pc .pn{font-weight:700;font-size:14px;overflow-wrap:anywhere;margin:2px 0}.pc .ps{font-size:11px;color:var(--mu)}
.pc .pp{font-size:26px;font-weight:800;color:var(--cy)}.pc .pp small{font-size:11px;font-weight:500;color:var(--mu)}
.st{margin-top:8px;border-radius:14px 14px 0 0;background:linear-gradient(180deg,rgba(43,140,255,.5),rgba(43,140,255,.06));border:1px solid var(--bd);border-bottom:0;transform-origin:bottom;animation:grow .9s .25s both}
.pc.a .st{height:96px;background:linear-gradient(180deg,rgba(251,191,36,.55),rgba(251,191,36,.05))}.pc.b .st{height:68px}.pc.c .st{height:48px}
.pc.a{order:2}.pc.b{order:1}.pc.c{order:3}
@keyframes grow{from{transform:scaleY(0)}}
.row{display:flex;align-items:center;gap:12px;background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:9px;backdrop-filter:blur(10px);animation:up .55s both;animation-delay:var(--d,0ms);transition:transform .25s,border-color .25s}
.row:hover{transform:translateY(-2px) scale(1.008);border-color:rgba(43,140,255,.6)}
.rk{width:40px;height:40px;border-radius:12px;background:rgba(43,140,255,.16);color:#8fc0ff;display:grid;place-items:center;font-weight:700;flex:none}
.rk.m{background:none;font-size:25px}
.nm{flex:1;min-width:0}.nm b{display:block;font-weight:600;overflow-wrap:anywhere}.nm span{display:block;color:var(--mu);font-size:12.5px}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--pr),var(--cy));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.pt{text-align:end;flex:none;font-size:24px;font-weight:800;color:var(--cy);line-height:1}.pt small{display:block;font-size:11px;font-weight:500;color:var(--mu);margin-top:3px}
details{margin-bottom:9px;animation:up .55s both;animation-delay:var(--d,0ms)}details .row{margin:0;animation:none}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
.mem{margin:4px 6px 0;padding:6px 14px;background:var(--gl);border:1px solid var(--bd);border-radius:14px}
.mem div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px dashed var(--bd)}.mem div:last-child{border:0}.mem em{color:var(--mu);font-style:normal;font-size:12px}
.sk{height:68px;border-radius:16px;margin-bottom:9px;background:linear-gradient(100deg,var(--gl) 30%,rgba(255,255,255,.12) 50%,var(--gl) 70%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mu);padding:34px 10px}
.foot{margin-top:26px;text-align:center;color:var(--mu);font-size:12.5px;animation:up .8s .4s both}.foot p{margin:6px 0}
.row{position:relative}.row>*{position:relative}.row::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(190px circle at var(--mx,50%) var(--my,50%),rgba(43,140,255,.2),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}.row:hover::before{opacity:1}.row.ck,.pc.ck{cursor:pointer}
.tag{margin:0 0 12px;color:var(--mu);font-size:14px;min-height:21px}.tag.in{animation:tg .6s both}@keyframes tg{from{opacity:0;transform:translateY(7px)}}
.dl{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-inline-start:6px;vertical-align:middle}.dl.up{background:rgba(34,197,94,.18);color:#4ade80}.dl.dn{background:rgba(255,77,109,.18);color:#ff7a93}.dl.nw{background:rgba(251,191,36,.18);color:#fbbf24}
.ct{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin:2px 2px 8px}.cs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}.cs::-webkit-scrollbar{display:none}
.ch{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:136px;padding:10px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font-family:inherit;text-align:start;cursor:pointer;backdrop-filter:blur(8px);animation:up .5s both;transition:.25s}.ch:hover{transform:translateY(-3px);border-color:rgba(251,191,36,.6)}.ce{font-size:20px}.cn{font-weight:600;font-size:13.5px}.cf{font-size:11px;color:var(--mu)}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:70;padding:11px 18px;border-radius:99px;background:rgba(14,22,48,.96);border:1px solid var(--bd);font-weight:600;font-size:14px;transition:.4s;pointer-events:none;max-width:92vw;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.mdl{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(3,6,18,.72);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}.mdl.on{opacity:1;pointer-events:auto}
.mcard{position:relative;width:min(380px,100%);padding:24px 22px;border-radius:22px;background:linear-gradient(160deg,rgba(32,48,92,.96),rgba(10,16,36,.98));border:1px solid var(--bd);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(43,140,255,.25);transform:translateY(24px) scale(.94);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}.mdl.on .mcard{transform:none}
.mcard .x{position:absolute;top:12px;inset-inline-end:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--gl);color:var(--tx);cursor:pointer}
.mr{font-size:34px;font-weight:800}.mr small{font-size:13px;color:var(--mu);font-weight:500}.mcard h2{margin:2px 0 0;font-size:22px}.ms{color:var(--mu);font-size:13px}.mp{margin:12px 0 10px;font-size:15px;color:var(--mu)}.mp b{font-size:44px;font-weight:800;color:var(--cy);margin-inline-end:4px}
.bk{display:grid;grid-template-columns:1fr auto;font-size:13.5px;margin-bottom:9px}.bk b{color:var(--cy)}.bk .bar{grid-column:1/-1}.gp{margin-top:14px;padding:11px 14px;border-radius:14px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);font-weight:600;font-size:14px}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

function parse(j){var v=j.values,b=j.bold;return CFG.map(function(f){var teams=[],cur=null;for(var r=2;r<v.length;r++){var n=String(v[r][f.c]||"").trim();if(!n){cur=null;continue}if(b[r][f.c]||!cur){cur={leader:n,members:[]};teams.push(cur)}cur.members.push({n:n,v:parseFloat(v[r][f.c+1])||0,a:parseFloat(v[r][f.c+3])||0})}return{key:f.key,name:f.name,unit:f.unit,pts:f.pts,per:f.per,teams:teams}})}
function build(){var people=[],teams=[];DATA.forEach(function(f){f.teams.forEach(function(t){var big=t.members.length>=2,k=big?Math.min.apply(null,t.members.map(function(m){return m.a})):0,sum=0,tn=TEAM_NAMES[t.leader]||t.leader;var ms=t.members.map(function(m){var fp=Math.floor(m.v/f.per)*f.pts,ap=m.a*ATT,p=fp+ap+k;sum+=p;var o={id:people.length,n:m.n,fn:f.name,fk:f.key,p:p,fp:fp,ap:ap,bp:k,v:m.v,a:m.a,unit:f.unit,team:tn};people.push(o);return o});teams.push({id:teams.length,name:tn,leader:t.leader,fn:f.name,fk:f.key,p:sum,bonus:k,ms:ms})})});
 [people,teams].forEach(function(arr){var s=arr.slice().sort(function(x,y){return y.p-x.p||(x.n||x.name).localeCompare(y.n||y.name)}),r=0,last=null;s.forEach(function(x,i){if(x.p!==last){r=i+1;last=x.p}x.g=r;x.si=i});arr.sorted=s});
 return{people:people,teams:teams}}
function medal(r){return r==1?"🥇":r==2?"🥈":"🥉"}
function countUp(el){var to=+el.dataset.n;if(RM||!to){el.textContent=to;return}var t0=null;function f(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function sub(x){return tab=="i"?esc(x.fn)+" · "+esc(x.team)+" · "+x.v+" "+esc(x.unit)+" · "+x.a+" att.":esc(x.fn)+" · "+x.ms.length+" member"+(x.ms.length>1?"s":"")+(x.bonus?" · +"+x.bonus+" full-attendance":"")}
function nmOf(x){return tab=="i"?x.n:x.name}
var EMO={BD:"💼",OGV:"🌍",OGT:"🧳",B2C:"📣",RAISING:"💰",ICX:"🚀"};
function dl(x){if(fk!="all"||!SNAP.p)return"";var o=SNAP.p[(tab=="i"?"i:":"t:")+x.fk+"|"+nmOf(x)];if(o===undefined)return' <em class="dl nw">NEW</em>';var d=o-x.g;return d>0?' <em class="dl up">▲'+d+"</em>":d<0?' <em class="dl dn">▼'+(-d)+"</em>":""}
function row(x,i,max){var d=Math.min(i,14)*45,r=(x.p>0&&x.r<=3)?'<div class="rk m">'+medal(x.r)+'</div>':'<div class="rk">'+x.r+'</div>';
 var body=r+'<div class="nm"><b>'+esc(nmOf(x))+dl(x)+'</b><span>'+sub(x)+'</span><div class="bar"><i data-w="'+Math.round(x.p/max*100)+'"></i></div></div><div class="pt"><b data-n="'+x.p+'">0</b><small>pts</small></div>';
 if(tab=="i")return'<div class="row ck" data-id="'+x.id+'" style="--d:'+d+'ms">'+body+'</div>';
 return'<details style="--d:'+d+'ms"><summary><div class="row">'+body+'</div></summary><div class="mem">'+x.ms.map(function(m){return"<div><span>"+esc(m.n)+" <em>"+m.v+" "+esc(m.unit)+" · "+m.a+" att.</em></span><b>"+m.p+"</b></div>"}).join("")+"</div></details>"}
function champs(){var h="";CFG.forEach(function(f,i){var best=null;B.people.forEach(function(x){if(x.fk==f.key&&x.p>0&&(!best||x.p>best.p))best=x});if(best)h+='<button class="ch" data-k="'+f.key+'" style="animation-delay:'+i*70+'ms"><span class="ce">'+EMO[f.key]+'</span><span class="cn">'+esc(best.n)+'</span><span class="cf">'+esc(f.name)+" · "+best.p+" pts</span></button>"});return h?'<div class="ct">Function champions</div><div class="cs">'+h+"</div>":""}
function render(){
 var q=$("q").value.trim().toLowerCase(),a=(tab=="i"?B.people:B.teams).filter(function(x){return fk=="all"||x.fk==fk});
 a.sort(function(x,y){return y.p-x.p||nmOf(x).localeCompare(nmOf(y))});var r=0,last=null;a.forEach(function(x,i){if(x.p!==last){r=i+1;last=x.p}x.r=r});
 var max=(a[0]&&a[0].p)||1,h="",rest=a;
 if(q)rest=a.filter(function(x){return(nmOf(x)+(x.ms?x.ms.map(function(m){return m.n}).join(" "):"")).toLowerCase().indexOf(q)>-1});
 else{if(tab=="i"&&fk=="all")h+=champs();
  if(a.length>=3&&a[0].p>0){var cl=["a","b","c"];h+='<div class="pod">'+a.slice(0,3).map(function(x,i){return'<div class="pc '+cl[i]+(tab=="i"?" ck":"")+'" data-id="'+(tab=="i"?x.id:"")+'" style="animation-delay:'+(i==0?.35:i==1?.15:.05)+'s"><div class="md">'+(i==0?"👑":medal(i+1))+'</div><div class="pn">'+esc(nmOf(x))+'</div><div class="ps">'+esc(x.fn)+'</div><div class="pp"><span data-n="'+x.p+'">0</span> <small>pts</small></div><div class="st"></div></div>'}).join("")+"</div>";rest=a.slice(3)}}
 h+=rest.map(function(x,i){return row(x,i,max)}).join("");
 $("list").innerHTML=h||'<div class="empty">No results</div>';
 document.querySelectorAll("#list [data-n]").forEach(countUp);
 requestAnimationFrame(function(){requestAnimationFrame(function(){document.querySelectorAll("#list .bar i").forEach(function(e){e.style.width=e.dataset.w+"%"})})})}
function chips(){$("chips").innerHTML=[{key:"all",name:"All"}].concat(CFG).map(function(f){return'<button class="chip'+(f.key==fk?" on":"")+'" data-k="'+f.key+'">'+esc(f.name)+"</button>"}).join("");
 document.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){fk=c.dataset.k;chips();render()}})}
function live(ok){$("live").className="pill"+(ok?"":" off");$("lt").textContent=ok?"Live":"Offline · retrying"}
function load(){fetch(SHEET_URL,{credentials:"omit"}).then(function(r){return r.json()}).then(function(j){var d=parse(j),s=JSON.stringify(d);live(true);if(s!==sig){sig=s;DATA=d;B=build();render();saveSnap();hello()}}).catch(function(){live(false);if(!DATA.length)$("list").innerHTML='<div class="empty">Couldn’t load the data. Check your connection and refresh.</div>'})}
document.querySelectorAll("#seg button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;$("seg").dataset.t=tab;render()}});
$("q").oninput=render;chips();
var SNAP=(function(){var t=new Date().toDateString(),o={t:t,p:null};try{var c=JSON.parse(localStorage.getItem("snapC")||"null"),p=JSON.parse(localStorage.getItem("snapP")||"null");if(c&&c.d!==t){p=c;localStorage.setItem("snapP",JSON.stringify(c))}o.p=p&&p.r||null}catch(e){}return o})();
function saveSnap(){try{var r={};B.people.forEach(function(x){r["i:"+x.fk+"|"+x.n]=x.g});B.teams.forEach(function(x){r["t:"+x.fk+"|"+x.name]=x.g});localStorage.setItem("snapC",JSON.stringify({d:SNAP.t,r:r}))}catch(e){}}
var cv=$("cv"),cx=cv.getContext("2d"),PS=[],run=false,COL=["#2b8cff","#22d3ee","#fbbf24","#ff4d6d","#a78bfa","#ffffff"];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener("resize",rs);
function burst(x,y,n){if(RM)return;for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=4+Math.random()*9;PS.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COL[i%COL.length],l:1})}if(PS.length>400)PS.splice(0,PS.length-400);if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);PS=PS.filter(function(p){p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.006;if(p.l<=0||p.y>cv.height+20)return false;cx.save();cx.globalAlpha=Math.min(1,p.l*2);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();return true});if(PS.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
function hello(){try{var s=B.people.sorted[0];if(!sessionStorage.getItem("cf")&&s&&s.p>0){sessionStorage.setItem("cf","1");setTimeout(function(){burst(innerWidth/2,150,110)},700)}}catch(e){}}
var tm;function toast(t){var e=$("ts");e.textContent=t;e.classList.add("on");clearTimeout(tm);tm=setTimeout(function(){e.classList.remove("on")},3200)}
var TAGS=["Who’s taking the crown today? 👑","Every point counts 🔥","Catch the leader 🚀","Small wins, big flex 💪","يلا نشوف مين هياخد التاج 👑","Your move. Make it count ⚡"],ti=0;
function tg(){var e=$("tag");e.classList.remove("in");void e.offsetWidth;e.textContent=TAGS[ti++%TAGS.length];e.classList.add("in")}tg();setInterval(tg,3600);
function openM(id){var x=B.people[id];if(!x)return;var s=B.people.sorted,ab=null,bl=null,i;for(i=x.si-1;i>=0;i--)if(s[i].p>x.p){ab=s[i];break}for(i=x.si+1;i<s.length;i++)if(s[i].p<x.p){bl=s[i];break}
 var g=x.p<=0?"Get your first point on the board! 🔥":!ab?"👑 Leading — "+(bl?(x.p-bl.p)+" pts ahead of "+esc(bl.n):"nobody is close"):"🚀 "+(ab.p-x.p)+" pts to pass "+esc(ab.n);
 var rows=[[x.v+" "+x.unit,x.fp],["Attendance · "+x.a+" × "+ATT,x.ap]];if(x.bp)rows.push(["Full-team bonus",x.bp]);var mx=Math.max(x.p,1);
 $("mc").innerHTML='<button class="x" aria-label="Close">✕</button><div class="mr">'+(x.g<=3&&x.p>0?medal(x.g):"#"+x.g)+' <small>of '+s.length+'</small></div><h2>'+esc(x.n)+'</h2><div class="ms">'+esc(x.fn)+" · "+esc(x.team)+'</div><div class="mp"><b data-n="'+x.p+'">0</b>pts</div>'+rows.map(function(r){return'<div class="bk"><span>'+esc(r[0])+"</span><b>+"+r[1]+'</b><div class="bar"><i data-w="'+Math.round(r[1]/mx*100)+'"></i></div></div>'}).join("")+'<div class="gp">'+g+"</div>";
 $("md").classList.add("on");$("mc").querySelectorAll("[data-n]").forEach(countUp);
 requestAnimationFrame(function(){requestAnimationFrame(function(){$("mc").querySelectorAll(".bar i").forEach(function(e){e.style.width=e.dataset.w+"%"})})});
 if(x.g<=3&&x.p>0)burst(innerWidth/2,innerHeight*.3,60)}
function closeM(){$("md").classList.remove("on")}
$("md").addEventListener("click",function(e){if(e.target===this||e.target.closest(".x"))closeM()});
addEventListener("keydown",function(e){if(e.key=="Escape")closeM()});
$("list").addEventListener("click",function(e){var c=e.target.closest(".ch,.pc,.row.ck");if(!c)return;if(c.classList.contains("ch")){fk=c.dataset.k;chips();render();return}if(c.classList.contains("pc"))burst(e.clientX,e.clientY,70);if(tab=="i"&&c.dataset.id)openM(+c.dataset.id)});
$("list").addEventListener("mousemove",function(e){var r=e.target.closest(".row");if(r){var b=r.getBoundingClientRect();r.style.setProperty("--mx",e.clientX-b.left+"px");r.style.setProperty("--my",e.clientY-b.top+"px")}});
var tp=0,tt;document.querySelectorAll(".brands img").forEach(function(i){i.addEventListener("click",function(){tp++;clearTimeout(tt);tt=setTimeout(function(){tp=0},1800);if(tp>=5){tp=0;burst(innerWidth*.25,innerHeight*.4,80);burst(innerWidth*.75,innerHeight*.4,80);burst(innerWidth/2,innerHeight*.25,80);toast("You found the secret 🎉 RIOT is watching 👀")}})});
$("list").innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
load();setInterval(load,60000);document.addEventListener("visibilitychange",function(){if(!document.hidden)load()});
</script></body></html>
